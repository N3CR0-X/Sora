name: Instalar e publicar Sora
on:
  push:
    paths:
      - .github/workflows/sora-instalar.yml
permissions:
  contents: write
  pages: write
jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar o site
        run: |
          set -eu
          python3 - <<'PY'
          import hashlib, io, pathlib, re, urllib.request, zipfile
          url='https://tmpfiles.org/wtARbiKfdN51/sora.zip'
          page=urllib.request.urlopen(url,timeout=30).read().decode()
          match=re.search(r'class="download" href="([^"]+)"',page)
          if not match: raise SystemExit('Link de download não encontrado')
          data=urllib.request.urlopen(match.group(1),timeout=60).read()
          if hashlib.sha256(data).hexdigest()!='2b9b134513ecbe2a12f70b9671b66ea4c4f3a2d83cbad3f1d974c9e8827b16da': raise SystemExit('Integridade do pacote incorreta')
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for item in z.infolist():
                  path=pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts: raise SystemExit('Caminho inválido')
                  if item.is_dir(): continue
                  target=pathlib.Path(*path.parts);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(item))
          PY
      - name: Subir site para a branch principal
        run: |
          set -eu
          git rm .github/workflows/sora-instalar.yml
          git add .nojekyll index.html 404.html assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publicar site estático Sora'
          git push
      - name: Ativar GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh api repos/N3CR0-X/Sora/pages >/dev/null 2>&1; then
            gh api --method POST repos/N3CR0-X/Sora/pages -f 'source[branch]=main' -f 'source[path]=/'
          fi
          gh api --method POST repos/N3CR0-X/Sora/pages/builds
